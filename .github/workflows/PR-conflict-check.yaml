name: PR Conflict Check

'on':
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    pull_request_review:
        types:
            - submitted
            - dismissed

permissions:
    contents: read
    pull-requests: read

jobs:
    check-conflict:
        runs-on: ubuntu-latest
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            -
                name: Check if PR is mergeable
                uses: actions/github-script@v7
                with:
                    script: |
                        const prNumber = context.payload.pull_request ?
                        context.payload.pull_request.number :
                        context.payload.review.pull_request.number;

                        const repo = context.repo;
                        let pr;

                        while (true) {
                            const response = await github.rest.pulls.get({
                                owner: repo.owner,
                                repo: repo.repo,
                                pull_number: prNumber,
                            });

                            pr = response.data;
                            if (pr.mergeable !== null) {
                                break;
                            }

                            console.log("GitHub is still calculating merge eligibility. Check again in 10 seconds.");
                            await new Promise(resolve => setTimeout(resolve, 10000));
                        }

                        const { data: reviews } = await
                        github.rest.pulls.listReviews({
                            owner: repo.owner,
                            repo: repo.repo,
                            pull_number: prNumber,
                        });

                        const isApproved = reviews.some(r => r.state === 'APPROVED');

                        console.log(`PR Mergeable status: ${pr.mergeable_state}, Approval status: ${isApproved}`);

                        if (isApproved) {
                            console.log("Approval confirmed, merge will be allowed even if there are conflicts.");
                            return;
                        }

                        if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                            core.setFailed("This PR has conflicts. Please resolve them.");
                        } else if (pr.mergeable === null) {
                            core.warning("GitHub is still calculating merge eligibility.");
                        } else {
                            console.log("No conflicts, merge will be allowed if approved.");
                        }
