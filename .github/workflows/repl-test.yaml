name: REPL Build and Test

"on":
    push:
        branches:
            - main
        paths:
            - "cli/**"
            - "engine/**"
            - "main.cpp"
            - ".github/workflows/repl-test.yaml"
    pull_request:
        paths:
            - "cli/**"
            - "engine/**"
            - "main.cpp"
            - ".github/workflows/repl-test.yaml"

permissions:
    contents: read

jobs:
    repl-test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            # cli/tests compares cuffsh's output with ../cuffc and silently skips the
            # check when cuffc has not been built.
            -   name: Build cuffc
                shell: bash
                run: make

            -   name: Build and Test REPL
                working-directory: cli
                shell: bash
                run: |
                    python3 -m pip install --quiet --break-system-packages pyte wcwidth

                    chmod +x build.sh tests/run_tests.sh
                    ./build.sh
                    ./tests/run_tests.sh
